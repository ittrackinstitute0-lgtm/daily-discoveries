name: Daily Discoveries Automated AI Research & Publish

on:
  schedule:
    # Runs twice daily at 9:00 AM (04:00 UTC) and 6:00 PM (13:00 UTC) Pakistan Standard Time (UTC+5)
    - cron: '0 4,13 * * *'
  # Allows manual triggering from the GitHub Actions tab anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run AI Discovery Research and Verification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/research_and_publish.py

      - name: Commit and Push Newly Verified Discoveries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/discoveries.json
          if git diff --staged --quiet; then
            echo "No new discoveries to commit."
          else
            git commit -m "Auto-publish: verified Pakistan discoveries by Gemini AI [skip ci]"
            git push origin main
          fi
